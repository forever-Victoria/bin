<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>bin 语音网关 · 测试页</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    max-width: 680px; margin: 0 auto; padding: 24px 16px 64px;
    line-height: 1.6;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  label { font-size: 13px; color: #aaa; width: 64px; }
  input, select {
    font: inherit; padding: 7px 10px; border: 1px solid #888; border-radius: 6px;
    background: #ffffff; color: #111111;
  }
  input::placeholder { color: #999; }
  input { flex: 1; min-width: 120px; }
  input[type="checkbox"] { flex: 0 0 auto; min-width: 0; width: 18px; height: 18px; }
  button {
    font: inherit; padding: 9px 16px; border: none; border-radius: 8px; cursor: pointer;
    background: #2f6fed; color: #fff; transition: background .15s, transform .05s;
  }
  button:hover { background: #1f5fd0; }
  button:active { transform: scale(.98); }
  button:disabled { background: #555; cursor: not-allowed; }
  button.secondary { background: #333; }
  button.secondary:hover { background: #444; }
  #talk {
    width: 100%; padding: 26px; font-size: 17px; border-radius: 14px;
    background: #2f6fed; user-select: none;
  }
  #talk.recording { background: #d23b3b; animation: pulse 1.2s infinite; }
  #talk:disabled { background: #555; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.65} }
  #status { font-size: 13px; margin: 14px 0; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#888; margin-right:6px; vertical-align:middle; }
  .dot.on { background:#3ec36b; }
  .dot.busy { background:#d2a23b; }
  #log {
    margin-top: 8px; height: 260px; overflow-y: auto; padding: 10px 12px;
    background: var(--bg,#1b1b1b); border: 1px solid #333; border-radius: 8px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px;
  }
  .log-line { margin: 2px 0; }
  .log-line.user { color: #6cb6ff; }
  .log-line.assistant { color: #7ee787; }
  .log-line.sys { color: #888; }
  .log-line.skip { color: #d2a23b; }
  .log-line.err { color: #ff7b72; }
  .hint { font-size: 12px; color: #777; margin-top: 6px; }
  .meter { height: 7px; flex: 1; min-width: 120px; overflow: hidden; background: #333; border-radius: 5px; }
  .meter > span { display: block; width: 0; height: 100%; background: #3ec36b; transition: width .08s; }
  #rmsText { width: 78px; font: 12px ui-monospace, monospace; color: #888; }
</style>
</head>
<body>
  <h1>bin 语音网关</h1>
  <div class="sub">豆包分体（ASR → LLM → TTS）· 浏览器联调页 · 等价于一台 ESP32</div>

  <div class="row">
    <label>地址</label>
    <input id="url" value="" placeholder="ws://host:8765" />
  </div>
  <div class="row">
    <label>设备</label>
    <input id="deviceId" value="web-001" />
    <label style="width:auto">角色</label>
    <input id="roleId" value="shanshan" style="flex:0 0 140px" />
  </div>
  <div class="row">
    <button id="connect" class="secondary">连接</button>
    <button id="disconnect" class="secondary" disabled>断开</button>
    <input id="fullDuplex" type="checkbox" checked />
    <label for="fullDuplex" style="width:auto">免按键实时对话</label>
  </div>
  <div class="row">
    <label>VAD 阈值</label>
    <input id="vadThreshold" type="number" value="600" min="50" max="10000" step="50" style="flex:0 0 90px;min-width:0" />
    <div class="meter"><span id="levelBar"></span></div>
    <span id="rmsText">RMS 0</span>
  </div>

  <div id="status"><span class="dot" id="dot"></span><span id="statusText">未连接</span></div>

  <button id="talk" disabled>按住说话，松开发送</button>
  <div class="hint" id="talkHint">按下开始采集上传，松开提交识别。播放回复期间按钮自动禁用。</div>

  <div id="log"></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

// 默认连本机同端口
$("url").value = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/";

const PCM_OUT_RATE = 24000;   // 下行播放采样率
const PCM_IN_RATE  = 16000;   // 上行采集目标采样率

let ws = null;
let ready = false;
let speaking = false;          // 收到 tts_start 后为 true
let serverBargeIn = false;
let conversationState = "disconnected"; // idle/listening/processing/speaking
let autoHeardSpeech = false;
let autoLoudMs = 0;
let lastLoudAt = 0;
let preRollChunks = [];
let preRollBytes = 0;

const AUTO_VAD_HOLD_MS = 80;
const AUTO_SILENCE_MS = 700;
const AUTO_PRE_ROLL_BYTES = PCM_IN_RATE * 2 * 300 / 1000;

// ── 上行采集 ─────────────────────────────────────────────
let micCtx = null, micStream = null, sourceNode = null, procNode = null;

async function startMic() {
  if (micStream) return;
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
  });
  micCtx = new AudioContext();   // 浏览器默认采样率（通常 48000）
  sourceNode = micCtx.createMediaStreamSource(micStream);
  // ScriptProcessor 已弃用但简单可靠，联调够用
  procNode = micCtx.createScriptProcessor(2048, 1, 1);
  sourceNode.connect(procNode);
  procNode.connect(micCtx.destination);
  procNode.onaudioprocess = onAudio;
}

function onAudio(e) {
  if (!ws || ws.readyState !== 1) return;
  const inRate = micCtx.sampleRate;
  const input = e.inputBuffer.getChannelData(0);
  const down = (inRate === PCM_IN_RATE) ? input : downsample(input, inRate, PCM_IN_RATE);
  const pcm16 = floatTo16(down);

  let sum = 0;
  for (let i = 0; i < pcm16.length; i++) sum += pcm16[i] * pcm16[i];
  const rms = pcm16.length ? Math.sqrt(sum / pcm16.length) : 0;
  const now = performance.now();
  const frameMs = pcm16.length * 1000 / PCM_IN_RATE;
  const threshold = Math.max(50, Number($("vadThreshold").value) || 600);
  const loud = rms >= threshold;
  updateLevelMeter(rms, threshold);

  if (loud) {
    lastLoudAt = now;
    if (conversationState === "listening") autoHeardSpeech = true;
  }

  if (!$("fullDuplex").checked) {
    if (pcm16.byteLength > 0) ws.send(pcm16.buffer);
    return;
  }

  if (conversationState === "speaking") {
    // 服务端用这一路连续音频做回声相关性和 barge-in 检测。
    if (pcm16.byteLength > 0) ws.send(pcm16.buffer);
    return;
  }

  if (conversationState === "listening") {
    if (pcm16.byteLength > 0) ws.send(pcm16.buffer);
    if (autoHeardSpeech && now - lastLoudAt >= AUTO_SILENCE_MS) finishAutoUtterance();
    return;
  }

  if (conversationState !== "idle") {
    clearPreRoll();
    autoLoudMs = 0;
    return;
  }

  rememberPreRoll(pcm16);
  autoLoudMs = loud ? autoLoudMs + frameMs : 0;
  if (autoLoudMs >= AUTO_VAD_HOLD_MS) {
    conversationState = "listening";
    autoHeardSpeech = true;
    autoLoudMs = 0;
    sendJson({ type: "listen_start" });
    for (const chunk of preRollChunks) ws.send(chunk.buffer);
    clearPreRoll();
    setStatus("正在听你说话…", "busy");
    log(`检测到开口（RMS ${Math.round(rms)}），自动 listen_start`, "sys");
  }
}

function rememberPreRoll(pcm16) {
  const copy = pcm16.slice();
  preRollChunks.push(copy);
  preRollBytes += copy.byteLength;
  while (preRollBytes > AUTO_PRE_ROLL_BYTES && preRollChunks.length > 1) {
    preRollBytes -= preRollChunks.shift().byteLength;
  }
}

function clearPreRoll() {
  preRollChunks = [];
  preRollBytes = 0;
}

function finishAutoUtterance() {
  if (conversationState !== "listening") return;
  conversationState = "processing";
  autoHeardSpeech = false;
  autoLoudMs = 0;
  sendJson({ type: "listen_end" });
  setStatus("识别和思考中…", "busy");
  log(`静音 ${AUTO_SILENCE_MS}ms，自动 listen_end`, "sys");
}

function updateLevelMeter(rms, threshold) {
  const percent = Math.min(100, rms / Math.max(threshold * 2, 1) * 100);
  $("levelBar").style.width = percent + "%";
  $("levelBar").style.background = rms >= threshold ? "#d23b3b" : "#3ec36b";
  $("rmsText").textContent = "RMS " + Math.round(rms);
}

function downsample(buffer, inRate, outRate) {
  if (outRate === inRate) return buffer;
  const ratio = inRate / outRate;
  const newLen = Math.round(buffer.length / ratio);
  const result = new Float32Array(newLen);
  let offRes = 0, offBuf = 0;
  while (offRes < newLen && offBuf < buffer.length) {
    const nextOff = Math.round((offRes + 1) * ratio);
    let acc = 0, cnt = 0;
    for (let i = offBuf; i < nextOff && i < buffer.length; i++) { acc += buffer[i]; cnt++; }
    result[offRes] = cnt ? acc / cnt : 0;
    offRes++; offBuf = nextOff;
  }
  return result;
}

function floatTo16(input) {
  const out = new Int16Array(input.length);
  for (let i = 0; i < input.length; i++) {
    const s = Math.max(-1, Math.min(1, input[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return out;
}

async function stopMic() {
  try { if (procNode) { procNode.disconnect(); procNode.onaudioprocess = null; } } catch {}
  try { if (sourceNode) sourceNode.disconnect(); } catch {}
  try { if (micStream) micStream.getTracks().forEach((t) => t.stop()); } catch {}
  try { if (micCtx) await micCtx.close(); } catch {}
  micCtx = micStream = sourceNode = procNode = null;
}

// ── 下行播放（24k PCM 队列）──────────────────────────────
let playCtx = null, nextPlayTime = 0;
let playSources = new Set();
let playbackEpoch = 0;
let playbackEnded = false;
let playedSamples16k = 0;
let activeTurnId = 0;

function ensurePlayCtx() {
  if (!playCtx) {
    playCtx = new AudioContext({ sampleRate: PCM_OUT_RATE });
    nextPlayTime = 0;
  }
  if (playCtx.state === "suspended") playCtx.resume();
}

function playPcm(int16) {
  ensurePlayCtx();
  const f32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
  const buf = playCtx.createBuffer(1, f32.length, PCM_OUT_RATE);
  buf.copyToChannel(f32, 0);
  const src = playCtx.createBufferSource();
  src.buffer = buf;
  const now = playCtx.currentTime;
  if (nextPlayTime < now) nextPlayTime = now;
  src.connect(playCtx.destination);
  const epoch = playbackEpoch;
  const samples16k = Math.round(int16.length * PCM_IN_RATE / PCM_OUT_RATE);
  playSources.add(src);
  src.onended = () => {
    playSources.delete(src);
    if (epoch !== playbackEpoch) return;
    playedSamples16k += samples16k;
    sendJson({ type: "playback_progress", turn_id: activeTurnId, samples: playedSamples16k });
    finishPlaybackIfDrained();
  };
  src.start(nextPlayTime);
  nextPlayTime += buf.duration;
}

function finishPlaybackIfDrained() {
  if (!playbackEnded || playSources.size !== 0 || !speaking) return;
  sendJson({ type: "playback_complete", turn_id: activeTurnId });
  speaking = false;
  conversationState = "idle";
  autoHeardSpeech = false;
  clearPreRoll();
  setStatus(ready ? "等你说话…" : "已连接", ready ? "on" : "busy");
  updateConversationControls();
}

function stopPlayback() {
  playbackEpoch++;
  for (const src of playSources) {
    try { src.onended = null; src.stop(); } catch {}
  }
  playSources.clear();
  nextPlayTime = playCtx ? playCtx.currentTime : 0;
  playbackEnded = false;
}

// ── WebSocket ────────────────────────────────────────────
function setStatus(text, kind) {
  $("statusText").textContent = text;
  const dot = $("dot");
  dot.className = "dot" + (kind ? " " + kind : "");
}

function connect() {
  const base = $("url").value.trim().replace(/\/$/, "");
  const device = encodeURIComponent($("deviceId").value.trim() || "web-001");
  const role = encodeURIComponent($("roleId").value.trim());
  const full = `${base}/?device_id=${device}&role_id=${role}`;
  log("连接 " + full, "sys");
  ws = new WebSocket(full);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { setStatus("已连接，等待 ready…", "busy"); };
  ws.onmessage = onMessage;
  ws.onclose = () => onClosed();
  ws.onerror = () => log("WebSocket 错误", "err");
}

function disconnect() {
  speaking = false;
  conversationState = "disconnected";
  stopPlayback();
  if (ws) { try { ws.close(); } catch {} }
}

function onClosed() {
  ws = null; ready = false; speaking = false; serverBargeIn = false;
  conversationState = "disconnected";
  autoHeardSpeech = false;
  autoLoudMs = 0;
  clearPreRoll();
  stopPlayback();
  setStatus("未连接");
  $("connect").disabled = false;
  $("disconnect").disabled = true;
  $("talk").disabled = true;
  $("talk").classList.remove("recording");
  $("talk").textContent = "按住说话，松开发送";
  stopMic();
  log("已断开", "sys");
}

async function onMessage(ev) {
  // 二进制：下行 24k PCM
  if (ev.data instanceof ArrayBuffer) {
    if (speaking) playPcm(new Int16Array(ev.data));
    return;
  }
  let obj;
  try { obj = JSON.parse(ev.data); } catch { return; }
  switch (obj.type) {
    case "ready":
      ready = true;
      serverBargeIn = !!obj.barge_in;
      conversationState = "idle";
      setStatus(`等你说话… · ${obj.role_name}（${obj.role_id}）`, "on");
      updateConversationControls();
      log(`就绪 角色=${obj.role_name}（${obj.role_id}） barge_in=${serverBargeIn}`, "sys");
      if ($("fullDuplex").checked) {
        try { await startMic(); } catch (e) { log("麦克风无法启动：" + e.message, "err"); }
      }
      updateDuplexHint();
      break;
    case "role_changed":
      log(`角色已切换：${obj.role_name}（${obj.role_id}）`, "sys");
      break;
    case "tts_start":
      speaking = true;
      conversationState = "speaking";
      autoHeardSpeech = false;
      clearPreRoll();
      activeTurnId = Number(obj.turn_id || activeTurnId + 1);
      playbackEpoch++;
      playSources.clear();
      playbackEnded = false;
      playedSamples16k = 0;
      nextPlayTime = 0;
      ensurePlayCtx();
      setStatus("播放中…", "busy");
      $("talk").disabled = true;
      break;
    case "tts_end":
      if (obj.turn_id && Number(obj.turn_id) !== activeTurnId) break;
      playbackEnded = true;
      finishPlaybackIfDrained();
      break;
    case "transcript":
      log(obj.text, obj.role);
      break;
    case "round_skip":
      log("跳过：" + (obj.reason || ""), "skip");
      conversationState = "idle";
      autoHeardSpeech = false;
      setStatus("等你说话…", "on");
      updateConversationControls();
      break;
    case "barge_in":
      log("打断（barge_in）", "sys");
      stopPlayback();
      speaking = false;
      conversationState = "listening";
      autoHeardSpeech = performance.now() - lastLoudAt < 500;
      sendJson({ type: "barge_ack", turn_id: Number(obj.turn_id || activeTurnId) });
      setStatus("正在听打断内容…", "busy");
      try { await startMic(); } catch (e) { log("麦克风无法启动：" + e.message, "err"); }
      break;
    case "error":
      log("错误：" + (obj.message || ""), "err");
      if (!speaking) {
        conversationState = "idle";
        setStatus("等你说话…", "on");
        updateConversationControls();
      }
      break;
  }
}

function sendJson(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

// ── 按住说话 ──────────────────────────────────────────────
async function talkStart() {
  if (!ready || $("fullDuplex").checked || conversationState !== "idle") return;
  conversationState = "listening";
  sendJson({ type: "listen_start" });
  $("talk").classList.add("recording");
  $("talk").textContent = "松开发送…";
  try {
    await startMic();
  } catch (e) {
    log("麦克风无法启动：" + e.message, "err");
    sendJson({ type: "cancel" });
    $("talk").classList.remove("recording");
    $("talk").textContent = "按住说话，松开发送";
  }
}

async function talkEnd() {
  if (!$("talk").classList.contains("recording")) return;
  $("talk").classList.remove("recording");
  $("talk").textContent = "按住说话，松开发送";
  conversationState = "processing";
  sendJson({ type: "listen_end" });
  await stopMic();
  setStatus("识别中…", "busy");
}

function updateDuplexHint() {
  const enabled = $("fullDuplex").checked;
  $("talkHint").textContent = enabled
    ? `免按键实时对话已开启：直接说话即可；静音 ${AUTO_SILENCE_MS}ms 自动提交，AI 播放时开口可直接打断。`
    : "按下开始采集上传，松开提交识别。播放回复期间按钮自动禁用。";
  updateConversationControls();
}

function updateConversationControls() {
  const realtime = $("fullDuplex").checked;
  $("talk").disabled = !ready || realtime || speaking;
  $("talk").textContent = realtime ? "实时对话中（无需按键）" : "按住说话，松开发送";
}

// ── 日志 ─────────────────────────────────────────────────
function log(text, cls) {
  const div = document.createElement("div");
  div.className = "log-line " + (cls || "sys");
  div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  const box = $("log");
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ── 绑定 ─────────────────────────────────────────────────
$("connect").onclick = () => {
  $("connect").disabled = true;
  $("disconnect").disabled = false;
  connect();
};
$("disconnect").onclick = disconnect;
$("fullDuplex").onchange = async () => {
  updateDuplexHint();
  if (!ready) return;
  if ($("fullDuplex").checked) {
    try { await startMic(); } catch (e) { log("麦克风无法启动：" + e.message, "err"); }
  } else if (!$("talk").classList.contains("recording")) {
    if (conversationState === "listening") sendJson({ type: "cancel" });
    conversationState = "idle";
    autoHeardSpeech = false;
    autoLoudMs = 0;
    clearPreRoll();
    await stopMic();
  }
};

const talk = $("talk");
talk.addEventListener("pointerdown", (e) => { e.preventDefault(); talkStart(); });
talk.addEventListener("pointerup", (e) => { e.preventDefault(); talkEnd(); });
talk.addEventListener("pointerleave", () => { if (talk.classList.contains("recording")) talkEnd(); });
talk.addEventListener("pointercancel", () => { if (talk.classList.contains("recording")) talkEnd(); });

log("页面就绪。点「连接」开始。", "sys");
updateDuplexHint();
</script>
</body>
</html>
