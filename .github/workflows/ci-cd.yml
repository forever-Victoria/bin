name: bin gateway CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bin-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install gateway
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-name.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image-name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-name.outputs.image }}:latest
            ${{ steps.image-name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export exact image for direct deployment
        if: vars.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          docker pull "${{ steps.image-name.outputs.image }}:${{ github.sha }}"
          docker save "${{ steps.image-name.outputs.image }}:${{ github.sha }}" |
            gzip -1 > bin-gateway-image.tar.gz

      - name: Upload deployment image artifact
        if: vars.DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bin-gateway-image-${{ github.sha }}
          path: bin-gateway-image.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bin-gateway' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download exact image artifact
        uses: actions/download-artifact@v4
        with:
          name: bin-gateway-image-${{ github.sha }}
          path: /tmp/bin-gateway-image

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload production Compose file
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases'"
          scp -P "$DEPLOY_PORT" deploy/compose.prod.yaml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.yaml"
          scp -P "$DEPLOY_PORT" deploy/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy.sh"
          scp -P "$DEPLOY_PORT" /tmp/bin-gateway-image/bin-gateway-image.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/${GITHUB_SHA}.tar.gz"

      - name: Deploy exact commit image
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 '$DEPLOY_PATH/deploy.sh' &&
             '$DEPLOY_PATH/deploy.sh' '$IMAGE' '$DEPLOY_PATH' '$DEPLOY_PATH/releases/${GITHUB_SHA}.tar.gz'"
