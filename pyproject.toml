[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bin-voice-gateway"
version = "0.1.0"
description = "bin — 实时语音对话网关（豆包分体 ASR/LLM/TTS），替代 ljt（百炼 Omni 端到端）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["services", "roles", "web"]
